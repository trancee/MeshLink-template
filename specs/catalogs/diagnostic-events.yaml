# MeshLink Diagnostic Event Definitions
# Machine-readable reference for all diagnostic events.
# Source of truth: meshlink/src/commonMain/kotlin/ch/trancee/meshlink/diagnostics/DiagnosticEvent.kt
# SPEC-ANCHOR: diagnostic-event

diagnostic_code_ranges:
  configuration: "0x01xx"
  permission: "0x02xx"
  bluetooth: "0x03xx"
  crypto: "0x04xx"
  routing: "0x05xx"
  transfer: "0x06xx"
  storage: "0x07xx"
  lifecycle: "0x08xx"
  transport: "0x09xx"
  trust: "0x0Axx"
  internal: "0x0Fxx"

event_category_to_code_range:
  description: "Maps conceptual per-event category to wire diagnostic code range. Conceptual categories classify event types for host-side filtering; code ranges are the fixed 0x01–0x0F wire catalog."
  mapping:
    route: routing        # 0x05xx
    transfer: transfer    # 0x06xx
    transport: transport  # 0x09xx
    power: configuration  # 0x01xx (power mode changes are configuration events)
    handshake: crypto     # 0x04xx (Noise handshake is crypto-layer)
    key_rotation: crypto  # 0x04xx (key rotation is crypto-layer)
    noise: crypto         # 0x04xx (Noise session is crypto-layer)

common_event_fields:
  - name: code
    type: DiagnosticCode
    encoding: UShort
  - name: severity
    type: DiagnosticSeverity
  - name: occurredAt
    type: Instant

redaction: "No raw handles, addresses, keys, ciphertext, payloads, or platform exception text"

diagnostic_events:
  - name: RouteDecryptFailureEvent
    code: "0x0501"
    category: route
    description: "A routed frame failed to decrypt at the link layer."
    fields:
      - name: identity
        type: PeerIdentity
        description: "Peer from whom the frame was received"
      - name: frameType
        type: UByte
        description: "Type of frame that failed decryption"
      - name: failureReason
        type: DecryptFailureReason
        description: "Specific reason for decryption failure"
      - name: occurredAt
        type: Instant
        description: "When the event occurred"
        default: "Clock.System.now()"

  - name: TransportFallbackEvent
    code: "0x0901"
    category: transport
    description: "Data plane fell back from L2CAP CoC to GATT."
    fields:
      - name: identity
        type: PeerIdentity
        description: "Peer for whom fallback occurred"
      - name: reason
        type: TransportFallbackReason
        description: "Machine-observable reason for fallback"
      - name: occurredAt
        type: Instant
        default: "Clock.System.now()"

  - name: TransferBearerEvent
    code: "0x0601"
    category: transfer
    description: "Data plane bearer selected for a logical transfer."
    fields:
      - name: id
        type: TransferId
        description: "Contextual finite-payload identifier"
      - name: bearer
        type: Bearer
        description: "GATT or L2CAP bearer in use"
      - name: occurredAt
        type: Instant
        default: "Clock.System.now()"

  - name: PowerModeEffectiveEvent
    code: "0x0102"
    category: power
    description: "Effective power mode parameters after regulatory clamping."
    fields:
      - name: requestedMode
        type: PowerMode
        description: "Mode requested by host app"
      - name: effectiveMode
        type: PowerMode
        description: "Mode actually in effect after EU clamping"
      - name: regulatoryRegion
        type: RegulatoryRegion
        description: "Regulatory region in effect"
      - name: scanDutyCycle
        type: Int
        unit: percent
        description: "Effective scan duty cycle percentage"
      - name: advertisementInterval
        type: Duration
        description: "Effective advertisement interval"
      - name: activeConnectionInterval
        type: Duration
        description: "Effective active connection interval"
      - name: idleConnectionInterval
        type: Duration
        description: "Effective idle connection interval"
      - name: idleTransitionDelay
        type: Duration
        description: "Idle interval transition delay"
      - name: concurrentConnectionLimit
        type: Int
      - name: chunkSize
        type: Int
        unit: bytes
      - name: retryLimit
        type: Int
      - name: retryBudget
        type: Duration
      - name: disconnectGracePeriod
        type: Duration
      - name: occurredAt
        type: Instant
        default: "Clock.System.now()"

  - name: HandshakeEvent
    code: "0x0401"
    category: handshake
    description: "End-to-end or link-layer handshake completed or failed."
    fields:
      - name: id
        type: HandshakeId
      - name: pattern
        type: HandshakePattern
      - name: verificationLevel
        type: VerificationLevel
      - name: nonceReplayDetected
        type: Boolean
      - name: occurredAt
        type: Instant
        default: "Clock.System.now()"

  - name: KeyRotationEvent
    code: "0x0402"
    category: key_rotation
    description: "Key rotation announcement processed by a peer."
    fields:
      - name: identity
        type: PeerIdentity
        description: "Peer that announced key rotation"
      - name: oldGeneration
        type: UInt
        description: "Pinned generation before processing"
      - name: newGeneration
        type: UInt
        description: "Candidate generation after processing"
      - name: reason
        type: KeyRotationReason
        description: "PERIODIC, MANUAL, or SECURITY_EVENT"
      - name: continuityVerified
        type: Boolean
        description: "Whether the contiguous dual-signed proof chain validated to the existing pin"
      - name: conflictDetected
        type: Boolean
        description: "Whether different valid bindings claimed the same generation"
      - name: propagationDeadlineMet
        type: Boolean
        description: "True when the key rotation announcement reached all direct neighbors within the deadline"
      - name: occurredAt
        type: Instant
        default: "Clock.System.now()"

  - name: NoiseSessionEvent
    code: "0x0403"
    category: noise
    description: "Noise session state transition."
    fields:
      - name: id
        type: NoiseSessionId
      - name: identity
        type: PeerIdentity
      - name: layer
        type: NoiseLayer
      - name: role
        type: NoiseRole
      - name: pattern
        type: HandshakePattern
      - name: fromState
        type: NoiseSessionState
      - name: toState
        type: NoiseSessionState
      - name: failureReason
        type: "NoiseFailureReason?"
      - name: occurredAt
        type: Instant
        default: "Clock.System.now()"

  - name: RouteDigestMismatchEvent
    code: "0x0502"
    category: route
    description: "Route table digest mismatch triggered a full resync."
    fields:
      - name: identity
        type: PeerIdentity
        description: "Peer from whom mismatched digest was received"
      - name: localDigest
        type: ULong
        description: "Local route table FNV-1a 64-bit hash"
      - name: remoteDigest
        type: ULong
        description: "Remote peer's advertised route table hash"
      - name: occurredAt
        type: Instant
        default: "Clock.System.now()"

  - name: TransferSessionTransitionEvent
    code: "0x0602"
    category: transfer
    description: "Logical transfer state transition with highest contiguous boundary and optional result."
    fields:
      - name: id
        type: TransferId
        description: "Contextual finite-payload identifier"
      - name: identity
        type: PeerIdentity
        description: "Destination peer for this transfer"
      - name: state
        type: TransferState
        description: "New transfer state"
      - name: offset
        type: Long
        description: "Highest contiguous payload boundary acknowledged outgoing or accepted by the incoming sink"
      - name: total
        type: Long
        description: "Total payload size in bytes"
      - name: result
        type: "TransferResult?"
        description: "Terminal TransferResult if this transition ended in completion/cancellation/expiration/failure; null for non-terminal transitions"
      - name: occurredAt
        type: Instant
        default: "Clock.System.now()"

  - name: TransferFailureEvent
    code: "0x0603"
    category: transfer
    description: "Logical transfer reached a terminal failure state."
    fields:
      - name: id
        type: TransferId
        description: "Contextual finite-payload identifier"
      - name: identity
        type: PeerIdentity
        description: "Destination peer for this transfer"
      - name: result
        type: TransferResult
        description: "UnrecoverableFailure (protocol/sink failure) or TrustFailure (identity mismatch/revocation)"
      - name: occurredAt
        type: Instant
        default: "Clock.System.now()"
exception_error_codes:
  encoding: UShort
  ranges:
    configuration: "0x01xx"
    permission: "0x02xx"
    bluetooth: "0x03xx"
    crypto: "0x04xx"
    routing: "0x05xx"
    transfer: "0x06xx"
    storage: "0x07xx"
    lifecycle: "0x08xx"
    transport: "0x09xx"
    trust: "0x0Axx"
    internal: "0x0Fxx"

  rule: "Explicit stable values; never enum ordinals; error text is redacted"
  categories:
    configuration: [INVALID_PARAMETER, INVALID_STATE]
    permission: [PERMISSION_DENIED]
    bluetooth: [BLUETOOTH_DISABLED, COC_NOT_SUPPORTED, CONNECTION_FAILED, GATT_OPERATION_FAILED, L2CAP_CHANNEL_FAILED, RADIO_IN_USE]
    storage: [STORAGE_UNAVAILABLE, STORAGE_CORRUPTED]
    crypto: [CRYPTO_OPERATION_FAILED, SIGNATURE_VERIFICATION_FAILED, REPLAY_DETECTED]
    trust: [PEER_NOT_FOUND, KEY_UNKNOWN, TRUST_VIOLATION]
    routing: [NO_ROUTE, ROUTE_ADVERTISEMENT_FAILED, ROUTE_LOOP_DETECTED]
    transfer: [TRANSFER_TIMEOUT, TRANSFER_CANCELLED, TRANSFER_CORRUPTED, SESSION_NOT_FOUND, CHUNK_OUT_OF_BOUNDS]
    lifecycle: []
    transport: []
    internal: [INTERNAL_ERROR, SERIALIZATION_FAILED]

transfer_results:
  description: "Sealed interface of terminal outcomes surfaced to host apps. Non-terminal progress is represented by TransferState (AWAITING_DECISION, TRANSFERRING, ROUTE_UNAVAILABLE, RETRANSMITTING); transfer status remains null until a terminal condition occurs. Terminal outcomes (Completed, Cancelled, Expired) come from external completion/cancellation/expiration conditions; failure outcomes carry structured data directly (UnrecoverableFailure with message, TrustFailure with identity)."
  subtypes:
    - name: Completed
      carries: "—"
      description: "All chunks acknowledged and delivered"
    - name: Cancelled
      carries: "—"
      description: "Sender cancelled before completion"
    - name: Expired
      carries: "—"
      description: "Time-to-live exceeded without completion"
    - name: UnrecoverableFailure
      carries: "message: String"
      description: "Protocol, sink, or non-trust failure"
    - name: TrustFailure
      carries: "identity: PeerIdentity"
      description: "Identity mismatch, revoked peer, or security policy violation"
