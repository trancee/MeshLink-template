# MeshLink Diagnostic Event Definitions
# Machine-readable reference for all diagnostic events.
# Source of truth: meshlink/src/commonMain/kotlin/ch/trancee/meshlink/diagnostics/DiagnosticEvent.kt
# SPEC-ANCHOR: diagnostic-event

diagnostic_code_ranges:
  lifecycle_configuration: "0x01xx"
  discovery_peer: "0x02xx"
  transport_ble: "0x03xx"
  crypto_trust: "0x04xx"
  routing: "0x05xx"
  transfer: "0x06xx"
  storage: "0x07xx"
  internal: "0x0Fxx"

common_event_fields:
  - name: code
    type: DiagnosticCode
    encoding: UShort
  - name: severity
    type: DiagnosticSeverity
  - name: occurredAt
    type: Instant

redaction: "No raw handles, addresses, keys, ciphertext, payloads, or platform exception text"

diagnostic_events:
  - name: RouteDecryptFailureEvent
    category: route
    description: "A routed frame failed to decrypt at the link layer."
    fields:
      - name: peerIdentity
        type: PeerIdentity
        description: "Peer from whom the frame was received"
      - name: frameType
        type: FrameType
        description: "Type of frame that failed decryption"
      - name: failureReason
        type: DecryptFailureReason
        description: "Specific reason for decryption failure"
      - name: timestamp
        type: Instant
        description: "When the event occurred"
        default: "Clock.System.now()"

  - name: TransportFallbackEvent
    category: transport
    description: "Data plane fell back from L2CAP CoC to GATT."
    fields:
      - name: peerIdentity
        type: PeerIdentity
        description: "Peer for whom fallback occurred"
      - name: reason
        type: TransportFallbackReason
        description: "Machine-observable reason for fallback"
      - name: timestamp
        type: Instant
        default: "Clock.System.now()"

  - name: TransferDataPlaneBearerEvent
    category: transfer
    description: "Data plane bearer selected for a logical transfer."
    fields:
      - name: transferId
        type: TransferId
        description: "Source-owned 32-bit transfer identifier, scoped by authenticated origin"
      - name: bearer
        type: DataPlaneBearer
        description: "GATT or L2CAP bearer in use"
      - name: timestamp
        type: Instant
        default: "Clock.System.now()"

  - name: PowerModeEffectiveEvent
    category: power
    description: "Effective power mode parameters after regulatory clamping."
    fields:
      - name: requestedMode
        type: PowerMode
        description: "Mode requested by host app"
      - name: effectiveMode
        type: PowerMode
        description: "Mode actually in effect after EU clamping"
      - name: regulatoryRegion
        type: RegulatoryRegion
        description: "Regulatory region in effect"
      - name: scanDutyCyclePercent
        type: Int
        description: "Effective scan duty cycle percentage"
      - name: advertisementIntervalMs
        type: Int
        description: "Effective advertisement interval in milliseconds"
      - name: connectionIntervalMs
        type: Double
        description: "Effective connection interval in milliseconds"
      - name: timestamp
        type: Instant
        default: "Clock.System.now()"

  - name: HandshakeEvent
    category: handshake
    description: "End-to-end or link-layer handshake completed or failed."
    fields:
      - name: sessionId
        type: SessionId
        description: "Handshake session identifier"
      - name: pattern
        type: HandshakePattern
        description: "Noise pattern selected from trust state: XX without a trusted pin, IK with a trusted current pin"
      - name: verificationLevel
        type: VerificationLevel
        description: "Verification level achieved: FULL, TOFU_PIN, or NONE"
      - name: nonceReplayDetected
        type: Boolean
        description: "True if nonce replay was detected during handshake"
      - name: timestamp
        type: Instant
        default: "Clock.System.now()"

  - name: KeyRotationEvent
    category: key_rotation
    description: "Key rotation announcement processed by a peer."
    fields:
      - name: peerIdentity
        type: PeerIdentity
        description: "Peer that announced key rotation"
      - name: oldGeneration
        type: UInt
        description: "Pinned generation before processing"
      - name: newGeneration
        type: UInt
        description: "Candidate generation after processing"
      - name: continuityVerified
        type: Boolean
        description: "Whether the contiguous dual-signed proof chain validated to the existing pin"
      - name: conflictDetected
        type: Boolean
        description: "Whether different valid bindings claimed the same generation"
      - name: propagationDeadlineMet
        type: Boolean
        description: "True when the key rotation announcement reached all direct neighbors within the deadline"
      - name: reason
        type: KeyRotationReason
        description: "PERIODIC, MANUAL, or SECURITY_EVENT"
      - name: timestamp
        type: Instant
        default: "Clock.System.now()"

  - name: NoiseSessionTransitionEvent
    category: noise
    description: "Noise session state transition."
    fields:
      - name: peerIdentity
        type: PeerIdentity
        description: "Peer for this Noise session"
      - name: layer
        type: NoiseLayer
        description: "HOP_BY_HOP or END_TO_END"
      - name: fromState
        type: NoiseSessionState
        description: "Previous session state"
      - name: toState
        type: NoiseSessionState
        description: "New session state"
      - name: role
        type: NoiseRole
        description: "INITIATOR or RESPONDER"
      - name: handshakePattern
        type: HandshakePattern
        description: "Pattern used for this handshake"
      - name: failureReason
        type: "NoiseFailureReason?"
        description: "Failure reason if transition is to FAILED; null otherwise"
      - name: timestamp
        type: Instant
        default: "Clock.System.now()"

  - name: RouteDigestMismatchEvent
    category: route
    description: "Route table digest mismatch triggered a full resync."
    fields:
      - name: peerIdentity
        type: PeerIdentity
        description: "Peer from whom mismatched digest was received"
      - name: localDigest
        type: UInt
        description: "Local route table FNV-1a 32-bit hash"
      - name: remoteDigest
        type: UInt
        description: "Remote peer's advertised route table hash"
      - name: timestamp
        type: Instant
        default: "Clock.System.now()"

  - name: TransferSessionTransitionEvent
    category: transfer
    description: "Logical transfer state transition. Includes priority inherited from originating RoutingMessage for QoS monitoring and resource allocation decisions."
    fields:
      - name: transferId
        type: TransferId
        description: "Source-owned 32-bit transfer identifier, scoped by authenticated origin"
      - name: peerIdentity
        type: PeerIdentity
        description: "Destination peer for this transfer"
      - name: fromState
        type: TransferState
        description: "Previous transfer state"
      - name: toState
        type: TransferState
        description: "New transfer state"
      - name: offset
        type: Long
        description: "Highest contiguous payload boundary acknowledged outgoing or accepted by the incoming sink"
      - name: total
        type: Long
        description: "Total payload size in bytes"
      - name: timestamp
        type: Instant
        default: "Clock.System.now()"

  - name: TransferFailureEvent
    category: transfer
    description: "Logical transfer reached a terminal failure state."
    fields:
      - name: transferId
        type: TransferId
        description: "Source-owned 32-bit transfer identifier, scoped by authenticated origin"
      - name: peerIdentity
        type: PeerIdentity
        description: "Destination peer for this transfer"
      - name: reason
        type: TransferFailureReason
        description: "Unrecoverable (generic) or TrustFailure (identity mismatch/revocation)"
      - name: timestamp
        type: Instant
        default: "Clock.System.now()"

error_codes:
  encoding: UShort
  ranges:
    configuration: "0x01xx"
    permission_lifecycle: "0x02xx"
    bluetooth_transport: "0x03xx"
    storage: "0x04xx"
    crypto_trust: "0x05xx"
    routing: "0x06xx"
    transfer: "0x07xx"
    internal: "0x0Fxx"
  rule: "Explicit stable values; never enum ordinals; error text is redacted"
  categories:
    configuration: [INVALID_PARAMETER, INVALID_STATE]
    permission: [PERMISSION_DENIED]
    bluetooth: [BLUETOOTH_DISABLED, CONNECTION_FAILED, GATT_OPERATION_FAILED, L2CAP_CHANNEL_FAILED]
    storage: [STORAGE_UNAVAILABLE, STORAGE_CORRUPTED]
    crypto: [CRYPTO_OPERATION_FAILED, SIGNATURE_VERIFICATION_FAILED, REPLAY_DETECTED]
    trust: [PEER_NOT_FOUND, KEY_UNKNOWN, TRUST_VIOLATION]
    routing: [NO_ROUTE, ROUTE_ADVERTISEMENT_FAILED, ROUTE_LOOP_DETECTED]
    transfer: [TRANSFER_TIMEOUT, TRANSFER_CANCELLED, TRANSFER_CORRUPTED, CHUNK_OUT_OF_BOUNDS]
    internal: [INTERNAL_ERROR]

delivery_outcomes:
  description: "Terminal outcomes only. Non-terminal progress is represented by TransferState; TransferStatus.deliveryOutcome remains null until terminal."
  outcomes:
    - name: success
      source_state: COMPLETED
    - name: cancelled
      source_state: CANCELLED
    - name: timeout
      source_state: TIMED_OUT
    - name: rejected
      source_state: FAILED
      failure_reason: PayloadRejected
    - name: unrecoverable-failure
      source_state: FAILED
      failure_reason: Unrecoverable
    - name: trust-failure
      source_state: FAILED
      failure_reason: TrustFailure