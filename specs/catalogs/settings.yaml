# MeshLink Configuration Model
# Machine-readable reference for all configuration settings.
# Source of truth: SPEC.md §14 and meshlink/src/commonMain/kotlin/ch/trancee/meshlink/model/PowerMode.kt
# SPEC-ANCHOR: setting-model

validation:
  construction:
    - "appId is non-empty normalized UTF-8 and at most 255 bytes"
    - "all durations are positive where required"
    - "routeExpiry is greater than routeDigestInterval"
    - "route limits are positive and maxRoutes is at most 256"
    - "maxTransfersPerPeer is positive and at most 3"
    - "chunk, grace-period, and diagnostics-buffer bounds are valid"
    - "security invariants are not disableable"
  start:
    - "permissions and Bluetooth availability"
    - "protected key storage accessibility"
    - "provider self-tests"
    - "background integration when backgroundOperation is true"
    - "physical radio lease"

settings:
  MeshLinkSettings:
    package: ch.trancee.meshlink
    description: "MeshLink configuration DSL. Single source of truth for all tunable parameters."
    fields:
      - name: appId
        type: String
        required: true
        max_utf8_bytes: 255
        validation: "Non-empty, normalized UTF-8 stable across app updates; changing it requires a new MeshLink instance"
        description: "Host-supplied application/profile isolation identifier"
      - name: powerMode
        type: PowerMode
        default: "MEDIUM"
        description: "Performance vs battery trade-off mode"
      - name: regulatoryRegion
        type: RegulatoryRegion
        default: "DEFAULT"
        description: "Regulatory region controlling BLE radio policy clamping"
      - name: backgroundOperation
        type: Boolean
        default: false
        description: "Whether this instance validates and uses platform-authorized best-effort background BLE integration"
      - name: keyRotation
        type: KeyRotationSettings
        default: "KeyRotationSettings()"
        description: "Key rotation configuration"
      - name: transfer
        type: TransferSettings
        default: "TransferSettings()"
        description: "Transfer layer configuration"
      - name: routing
        type: RoutingSettings
        default: "RoutingSettings()"
        description: "Routing layer configuration"
      - name: diagnostics
        type: DiagnosticsSettings
        default: "DiagnosticsSettings()"
        description: "Diagnostics configuration"

  KeyRotationSettings:
    package: ch.trancee.meshlink
    description: "Key rotation configuration."
    fields:
      - name: interval
        type: Duration
        default: "Duration.days(3)"
        description: "How often to automatically rotate identity keys"
      - name: rotationGracePeriod
        type: Duration
        default: "Duration.hours(1)"
        description: "Grace period for the OLD key after a PLANNED rotation (periodic or manual). During this window, both old and new keys are accepted for in-flight sessions."
      - name: compromiseGracePeriod
        type: Duration
        default: "Duration.ZERO"
        description: "Grace period for the OLD key after a SECURITY-EVENT rotation (suspected compromise). Set to ZERO for immediate revocation — old key is rejected instantly. Non-zero values allow brief overlap for safety but weaken the security response."

  TransferSettings:
    package: ch.trancee.meshlink
    description: "Transfer layer configuration."
    fields:
      - name: maxRetries
        type: Int
        default: 5
        description: "Maximum retransmit attempts per chunk"
      - name: chunkSize
        type: Int
        default: 256
        description: "Default chunk size in bytes (overridden by power mode at session start)"
      - name: maxTransfersPerPeer
        type: Int
        default: 3
        maximum: 3
        description: "Maximum concurrent accepted or outgoing finite MESSAGE/TRANSFER payload operations per peer; terminal operations do not count"

  RoutingSettings:
    package: ch.trancee.meshlink
    description: "Routing layer configuration."
    fields:
      - name: routeAdvertisementChangeThreshold
        type: Int
        default: 3
        description: "Minimum EWMA-smoothed RSSI change in dB required to advertise a changed link cost."
      - name: routeDigestInterval
        type: Duration
        default: "Duration.minutes(5)"
        description: "Interval for sending the per-neighbor RouteExport digest. Mismatch triggers RouteSynchronization and RouteSnapshot."
      - name: routeExpiry
        type: Duration
        default: "Duration.minutes(15)"
        description: "Maximum time an imported candidate remains without renewal by matching RouteDigest, RouteAdvertisement, or RouteSnapshot. Neighbor disconnect invalidates immediately."
      - name: maxRoutes
        type: Int
        default: 256
        description: "Maximum distinct remote destination PeerIdentity values. Alternate candidates from adjacent peers do not consume additional route slots; the local self route is excluded."

  DiagnosticsSettings:
    package: ch.trancee.meshlink
    description: "Diagnostics configuration."
    fields:
      - name: emitToLog
        type: Boolean
        default: false
        description: "Whether to mirror diagnostic events to Logcat or unified logging"
      - name: eventBufferSize
        type: Int
        default: 1000
        description: "Bound on the internal diagnostic flow buffer; no application callback is configured in settings"

  meshLinkSettings:
    package: ch.trancee.meshlink
    description: "MeshLink configuration DSL builder function. Usage: val settings = meshLinkSettings { powerMode = PowerMode.HIGH; keyRotation { interval = Duration.days(1) } }"
    returns: MeshLinkSettings

runtime_mutability:
  mutable:
    - name: powerMode
      command: setPowerMode
      observable_state: powerMode
      effective_state: effectivePowerSettings
      description: "Existing transfers retain established chunk framing; new transfers and connections use updated effective values"
  immutable_for_instance:
    - appId
    - regulatoryRegion
    - backgroundOperation
    - keyRotation
    - transfer
    - routing
    - diagnostics
  reconfiguration_rule: "Stop the instance and construct a new MeshLink to change immutable settings"

connection_interval_adaptation:
  idle_after_seconds: 5
  idle_interval_min_ms: 500
  idle_interval_max_ms: 1000
  active_trigger: "Handshake, urgent control, acknowledgement, or data queued"
  battery_scope: "LOW/background idle"

power_mode_parameter_mapping:
  HIGH:
    scan_duty_cycle_percent: 20
    adv_interval_ms: 100
    conn_interval_min_ms: 7.5
    conn_interval_max_ms: 15
    max_concurrent: 8
    chunk_size_bytes: 512
    max_retries: 10
    retry_budget_seconds: 60
    grace_period_seconds: 15
  MEDIUM:
    scan_duty_cycle_percent: 10
    adv_interval_ms: 500
    conn_interval_min_ms: 15
    conn_interval_max_ms: 30
    max_concurrent: 4
    chunk_size_bytes: 256
    max_retries: 5
    retry_budget_seconds: 30
    grace_period_seconds: 30
  LOW:
    scan_duty_cycle_percent: 5
    adv_interval_ms: 1000
    conn_interval_min_ms: 30
    conn_interval_max_ms: 60
    max_concurrent: 2
    chunk_size_bytes: 128
    max_retries: 3
    retry_budget_seconds: 15
    grace_period_seconds: 45

eu_clamping:
  adv_interval_floor_ms: 300
  scan_duty_cycle_ceiling_percent: 70
  description: "When RegulatoryRegion = EU, advertisement interval values below 300ms are clamped to 300ms, and scan duty cycle values above 70% are clamped to 70%."