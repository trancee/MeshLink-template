implementation_status:
  implemented:
    - "PeerIdentity"
    - "Scoreboard / MutableScoreboard"
    - "SeqNo"
    - "TransferSession / TransferState / TransferResult"
    - "IdentityKey"
    - "PeerState"
    - "All enums in Enums.kt"
    - "MeshLinkState"
    - "DiagnosticEvent sealed hierarchy"
    - "DiagnosticCode constants (companion object)"
    - "PowerMode"
    - "TransferId"
    - "MessageId"
    - "MeshLinkVersion"
    - "AppHash"
    - "ErrorCode"
    - "TransferKind"
    - "TrustRecord"
    - "MeshHash"
    - "RoutingPolicy (configuration only)"
    - "KnownPeer"
    - "MeshLinkEnvironment and JvmMeshLinkEnvironment"
    - "HandshakeKey"
    - "MessageHandle, TransferHandle, TransferSink, TransferSource types"
    - "TransferStatus, Message, Transfer data classes"
    - "Custom MeshLink Wire Codec (frames, enums, models, bounded reader/writer)"
    - "ConstantTime primitives (4 functions)"
    - "ReplayWindow (64-bit sliding bitmap)"
    - "PayloadDecision (ACCEPTED/REJECTED)"
    - "L2capState enum"
    - "TransferOptions, TransferSource, TransferSink interfaces"
    - "MeshLinkSettings and settings DSL builders"
    - "JvmSecureStorage, JvmMonotonicClock, JvmRadioLease"
  not_implemented:
    - "MeshLink public API and lifecycle (start/pause/resume/stop/setPowerMode — TODO scaffolds)"
    - "KnownPeer snapshots and trust commands (revokeTrust/resetTrust — TODO)"
    - "Message and transfer functional integration in MeshLink.kt (handles, sinks, sources not wired)"
    - "Diagnostic flow delivery"
    - "Persisted source-owned sequence allocator (TransferId allocation strategy) - not yet wired into MeshLink lifecycle"
    - "RouteCandidate, LinkQuality, additive cost, EWMA, and hysteresis"
    - "RouteStatement and mandatory destination signatures"
    - "RouteCoordinator"
    - "RouteDigestTracker"
    - "RouteAdvertisementPlanner"
    - "TransferCoordinator"
    - "Noise handshake implementations (XX and IK)"
    - "CryptoProvider (X25519, Ed25519, ChaCha20-Poly1305, HKDF, HMAC) — meshlink-crypto is an external dependency"
    - "BLE transport layer (GATT/L2CAP)"
    - "KeyRotationProof handling, retained continuity chain, and rotation-recovery XX"
    - "TrustStore"
    - "PeerStateCoordinator"
    - "MeshLinkSettings DSL integration in MeshLink.kt"
    - "Virtual mesh harness"
    - "Power mode behavior (scan/adv/conn intervals, EU clamping — enum only, no behavior)"
    - "Noise session renewal (state machine specified but not wired)"
    - "Key rotation propagation (dual-signed proof specified but not implemented)"
    - "Discovery advertisement (two-service-UUID format, peerHint rotation)"
    - "GATT service and metadata resolution (enum/model only)"
    - "Bearer framing GATT/L2CAP (codec exists, not wired to transport)"
  partial:
    - "TransferLayer: TransferSession, Scoreboard, TransferResult, TransferId, MessageId models implemented; TransferCoordinator not yet implemented"
    - "SecurityLayer: ConstantTime, ReplayWindow, PayloadDecision primitives implemented; Noise/crypto stack not wired"
    - "Diagnostics: DiagnosticEvent and DiagnosticCode models implemented; flow delivery not wired"
    - "PowerManagement: PowerMode enum implemented; mode-driven behavior and EU clamping not wired"
    - "ConfigurationModel: MeshLinkSettings DSL implemented; integration in MeshLink.kt not wired"
    - "Architecture: MeshLink.kt scaffold exists; lifecycle/mesh networking not implemented"
    - "WireCodec: codec primitives implemented; frame content generation/parsing not yet wired to protocol"

