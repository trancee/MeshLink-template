implementation_status:
  implemented:
    - "PeerIdentity"
    - "Scoreboard / MutableScoreboard"
    - "TransferSession / TransferState / TransferResult"
    - "IdentityKey"
    - "PeerState"
    - "All enums in Enums.kt"
    - "MeshLinkState"
    - "DiagnosticEvent sealed hierarchy"
    - "PowerMode"
    - "HandshakeKey"
  not_implemented:
    - "MeshLink public API and lifecycle"
    - "KnownPeer snapshots and trust commands"
    - "Message and transfer handles, sources, and sinks"
    - "Diagnostic flow delivery"
    - "Internal non-Comparable SeqNo and persisted source-owned sequence allocator"
    - "RouteCandidate, LinkQuality, additive cost, EWMA, and hysteresis"
    - "RouteStatement and mandatory destination signatures"
    - "RouteCoordinator"
    - "RouteDigestTracker"
    - "RouteAdvertisementPlanner"
    - "TransferCoordinator"
    - "Noise handshake implementations (XX and IK)"
    - "CryptoProvider (X25519, Ed25519, ChaCha20-Poly1305, HKDF, HMAC)"
    - "BLE transport layer (GATT/L2CAP)"
    - "KeyRotationProof handling, retained continuity chain, and rotation-recovery XX"
    - "TrustStore"
    - "PeerStateCoordinator"
    - "MeshLinkSettings DSL integration"
    - "Virtual mesh harness"
    - "Custom MeshLink Wire Codec (frames, enums, models, bounded reader/writer)"
    - "TransferId and source-owned persisted range allocator"
    - "AppHash type and derivation (documented in ADR identity-binding-and-fail-closed.md; Pair<ULong,ULong> representation)"

