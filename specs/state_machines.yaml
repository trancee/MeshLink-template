# MeshLink State Machine Definitions
# Machine-readable reference for all state machines in the codebase.
# Source of truth: SPEC.md §3.4.1, §5.7, docs/decisions/crypto/noise-session-state-machine.md
# SPEC-ANCHOR: state-machine

state_machines:
  - name: TransferState
    package: ch.trancee.meshlink.model
    description: "Lifecycle state of a chunked transfer session."
    initial: IN_PROGRESS
    terminal_states:
      - COMPLETED
      - FAILED
      - TIMED_OUT
    states:
      - name: IN_PROGRESS
        description: "Transfer is actively in progress"
      - name: WAITING_FOR_ROUTE
        description: "Route was lost; waiting for route recovery before resuming"
      - name: RETRYING
        description: "Actively retrying: retransmitting missing chunks with backoff"
      - name: COMPLETED
        description: "All chunks received and scoreboard complete"
        terminal: true
      - name: FAILED
        description: "Terminal failure — unrecoverable or trust-related"
        terminal: true
      - name: TIMED_OUT
        description: "Retry budget or grace period exhausted without completion"
        terminal: true
    transitions:
      - from: IN_PROGRESS
        event: "All chunks received + scoreboard complete"
        to: COMPLETED
      - from: IN_PROGRESS
        event: "Error, cancel, or trust failure"
        to: FAILED
      - from: IN_PROGRESS
        event: "Route lost"
        to: WAITING_FOR_ROUTE
      - from: IN_PROGRESS
        event: "Chunk missing, schedule retransmit"
        to: RETRYING
      - from: WAITING_FOR_ROUTE
        event: "Route found, resume transfer"
        to: IN_PROGRESS
      - from: WAITING_FOR_ROUTE
        event: "Retry budget or grace period exhausted"
        to: TIMED_OUT
      - from: RETRYING
        event: "Retransmission complete, back in progress"
        to: IN_PROGRESS
      - from: RETRYING
        event: "Retry budget exhausted"
        to: FAILED

  - name: NoiseSessionState
    package: ch.trancee.meshlink.model
    description: "Noise link-layer session states. Applies to both hop-by-hop and end-to-end Noise sessions."
    initial: DISCONNECTED
    terminal_states:
      - FAILED
    states:
      - name: DISCONNECTED
        description: "No active session"
      - name: HANDSHAKING_XX
        description: "Performing Noise XX handshake (first contact, mutual TOFU)"
      - name: HANDSHAKING_IK
        description: "Performing Noise IK handshake (post-TOFU reconnect with pinned keys, 0-RTT)"
      - name: ESTABLISHED
        description: "Handshake complete, traffic keys established"
      - name: REKEYING
        description: "Key rotation in progress"
      - name: FAILED
        description: "Handshake or session failed terminally"
        terminal: true
    transitions:
      - from: DISCONNECTED
        event: "Initiate XX handshake"
        to: HANDSHAKING_XX
      - from: DISCONNECTED
        event: "Initiate IK handshake (pinned keys)"
        to: HANDSHAKING_IK
      - from: HANDSHAKING_XX
        event: "XX handshake success"
        to: ESTABLISHED
      - from: HANDSHAKING_IK
        event: "IK handshake success"
        to: ESTABLISHED
      - from: ESTABLISHED
        event: "Key rotation triggered"
        to: REKEYING
      - from: REKEYING
        event: "Rekey success"
        to: ESTABLISHED
      - from: HANDSHAKING_XX
        event: "Handshake failure (timeout, malformed, key mismatch, max retries)"
        to: FAILED
      - from: HANDSHAKING_IK
        event: "Handshake failure"
        to: FAILED
      - from: ESTABLISHED
        event: "Transport closed, rekey rejected, max retries exceeded"
        to: FAILED
      - from: REKEYING
        event: "Rekey failure"
        to: FAILED

  - name: PeerLifecycleState
    package: ch.trancee.meshlink
    description: "Internal runtime tracking type driving peer lifecycle (CONNECTED → DISCONNECTED → GONE). Not exposed publicly — only PeerConnectionState (CONNECTED, DISCONNECTED) is visible to host apps."
    initial: CONNECTED
    terminal_states:
      - GONE
    states:
      - name: CONNECTED
        description: "Active BLE link. Transfers may be in progress. Route entries remain live. Host app sees PeerEvent.Found(..., CONNECTED) or PeerEvent.StateChanged(..., CONNECTED)."
      - name: DISCONNECTED
        description: "BLE link was lost. Grace period active because peer may return quickly. Routes can degrade before full retraction. Transfers can pause instead of being abandoned. Host app sees PeerEvent.StateChanged(..., DISCONNECTED)."
      - name: GONE
        description: "Grace window expired without reconnection. MeshLink cleans up ephemeral state (presence, routes, pending transfer work). Pinned trust state remains. PeerEvent.Lost emitted to host app."
        terminal: true
    transitions:
      - from: CONNECTED
        event: "BLE link lost"
        to: DISCONNECTED
      - from: DISCONNECTED
        event: "BLE reconnects"
        to: CONNECTED
      - from: DISCONNECTED
        event: "Grace period expires (tier-dependent: HIGH=15s, MEDIUM=30s, LOW=45s)"
        to: GONE

  - name: TrustState
    package: ch.trancee.meshlink.model
    description: "Trust record state in the TrustStore. Tracks TOFU pinning lifecycle."
    initial: INITIATED
    states:
      - name: INITIATED
        description: "Handshake in progress, not yet verified"
      - name: TRUSTED
        description: "TOFU-pinned identity (first successful handshake)"
      - name: REVOKED
        description: "Explicitly revoked by user/application"
    transitions:
      - from: INITIATED
        event: "Handshake verified successfully"
        to: TRUSTED
      - from: TRUSTED
        event: "Explicit revocation via API"
        to: REVOKED
      - from: REVOKED
        event: "Explicit reset via API"
        to: INITIATED

  - name: KeyRotationState
    package: ch.trancee.meshlink.model
    description: "Key rotation lifecycle per peer. Not a single state machine but tracks per-peer key status."
    states:
      - name: CURRENT
        description: "Key is active and current"
      - name: GRACE_PERIOD
        description: "Old key retained for grace period after rotation (PERIODIC/MANUAL: rotationGracePeriod; SECURITY_EVENT: compromiseGracePeriod)"
      - name: REVOKED
        description: "Key fully revoked, no longer accepted"

  - name: TransferDeliveryOutcome
    package: ch.trancee.meshlink
    description: "Explicit, enumerated delivery outcomes surfaced to host apps (not a state machine but a result mapping)."
    mapping:
      - transfer_state: COMPLETED
        outcome: success
      - transfer_state: IN_PROGRESS
        outcome: in-progress
      - transfer_state: RETRYING
        outcome: retrying
      - transfer_state: WAITING_FOR_ROUTE
        outcome: route-waiting
      - transfer_state: TIMED_OUT
        outcome: timeout
      - transfer_state: FAILED
        failure_reason: Unrecoverable
        outcome: unrecoverable-failure
      - transfer_state: FAILED
        failure_reason: TrustFailure
        outcome: trust-failure

  - name: RoutingUpdateTrigger
    package: ch.trancee.meshlink
    description: "Events that trigger route updates. All non-immediate updates include random jitter (0-500ms) to avoid synchronization storms."
    triggers:
      - name: DIRECT_LINK_UP
        condition: "New GATT/L2CAP connection established"
        frame_type: RouteUpdate
        description: "Self-origin announcement on connect"
        jitter: false
        immediate: true
      - name: METRIC_CHANGE
        condition: "abs(newRssi - oldRssi) > routeUpdateChangeThreshold (default 3 dB)"
        frame_type: RouteUpdate
        jitter: true
        immediate: false
      - name: PERIODIC_FULL_SYNC
        condition: "Every fullTableSyncInterval (default 5 min)"
        frame_type: RouteUpdate
        description: "All routes sent"
        jitter: true
        immediate: false
      - name: ROUTE_EXPIRY
        condition: "Route entry not refreshed before routeEntryExpiry (default 15 min)"
        frame_type: RouteWithdrawal
        jitter: false
        immediate: true
      - name: DIGEST_MISMATCH
        condition: "Received RouteDigest differs from local table hash"
        frame_type: RouteUpdate
        description: "Full table pushed to mismatched peer"
        jitter: false
        immediate: true

  - name: MinimumIntervalEnforcement
    package: ch.trancee.meshlink
    description: "No more than one update to the same peer within routeUpdateMinInterval (default 1s), regardless of triggers."
    max_interval_enforcement:
      description: "If no triggers fire, a keep-alive RouteUpdate is sent at routeUpdateMaxInterval (default 30s) to refresh route freshness."