# MeshLink Data Model Definitions
# Machine-readable reference for all data classes in the codebase.
# Source of truth: meshlink/src/commonMain/kotlin/ch/trancee/meshlink/model/
# SPEC-ANCHOR: data-model

data_models:
  - name: PeerIdentity
    package: ch.trancee.meshlink.model
    type: value_class
    description: "Stable 16-byte peer identifier. Generated ONCE at install/first launch, stored permanently. NOT derived from public key — remains stable across key rotations."
    fields:
      - name: parts
        type: "Pair<ULong, ULong>"
        visibility: private
        description: "Lower (first) and upper (second) 8 bytes of the 16-byte identity"
    methods:
      - name: toString
        return_type: String
        description: "32-char hex representation (16 chars per ULong, zero-padded)"
      - name: toByteArray
        return_type: ByteArray
        description: "16-byte big-endian representation"
    constants:
      - name: ZERO
        value: "0UL to 0UL"
        description: "The zero identity (all bytes zero) — for initialization and comparison"
    companion_functions:
      - name: generate
        return_type: PeerIdentity
        description: "Generates a cryptographically random 16-byte peer identity"
      - name: fromBytes
        params:
          - name: bytes
            type: ByteArray
        return_type: PeerIdentity
        description: "Creates a PeerIdentity from a 16-byte ByteArray"
    functions:
      - name: toByteArray
        return_type: ByteArray
        description: "Converts this identity to a 16-byte ByteArray"

  - name: SeqNo
    package: ch.trancee.meshlink.model
    type: value_class
    description: "Unsigned 32-bit sequence number with safe wrap-around comparison. RFC 8966 §3.7 requires signed interpretation for seqno comparison."
    fields:
      - name: value
        type: UInt
        visibility: private
        description: "Raw sequence number value"
    methods:
      - name: toString
        return_type: String
        description: "Decimal string representation"
    constants:
      - name: ZERO
        value: "SeqNo(0u)"
        description: "Sequence number zero"
      - name: MAX_VALUE
        value: "SeqNo(UInt.MAX_VALUE)"
        description: "Maximum sequence number value (2^32 - 1 = 4294967295)"
    functions:
      - name: fromUInt
        params:
          - name: value
            type: UInt
        return_type: SeqNo
        description: "Creates a SeqNo from a raw UInt value (e.g., read from the wire). Deserialization counterpart to toUInt."
      - name: toUInt
        return_type: UInt
        description: "Raw 32-bit unsigned value, for wire serialization"
      - name: fromByteArray
        params:
          - name: bytes
            type: ByteArray
        return_type: SeqNo
        description: "Deserializes from a 4-byte big-endian byte array. Throws IllegalArgumentException if bytes.length != 4. Deserialization counterpart to toByteArray."
      - name: toByteArray
        return_type: ByteArray
        description: "Serializes to a 4-byte big-endian byte array for wire transmission. Deserialization counterpart to fromByteArray."
      - name: isZero
        return_type: Boolean
        description: "True if this seqno equals ZERO"
      - name: isNewerThan
        params:
          - name: other
            type: SeqNo
        return_type: Boolean
        description: "Returns true if this seqno is newer than other, handling 32-bit wrap-around. Uses signed comparison: (this - other).toInt() > 0"
      - name: isNewerThanOrEqualTo
        params:
          - name: other
            type: SeqNo
        return_type: Boolean
        description: "Returns true if this seqno is newer than or equal to other. Used by Babel feasibility condition (RFC 8966 §3.7)."
      - name: isOlderThan
        params:
          - name: other
            type: SeqNo
        return_type: Boolean
        description: "Returns true if this seqno is older than other. Symmetric to isNewerThan per RFC 8966 §3.7"
      - name: isOlderThanOrEqualTo
        params:
          - name: other
            type: SeqNo
        return_type: Boolean
        description: "Returns true if this seqno is older than or equal to other. Symmetric to isNewerThanOrEqualTo."
      - name: minus
        params:
          - name: other
            type: SeqNo
        return_type: Int
        description: "Signed difference for modular arithmetic comparison. (this - other) interpreted as signed 32-bit integer"
      - name: compareTo
        params:
          - name: other
            type: SeqNo
        return_type: Int
        description: "Comparable<SeqNo> implementation using the same modular signed comparison. Enables sorted() and min()/max() on collections of SeqNo values."
      - name: operator inc
        return_type: SeqNo
        description: "Increments seqno by 1 with modular wrap at 2^32. Operator form enables idiomatic 'seqNo++' syntax."
      - name: max
        params:
          - name: other
            type: SeqNo
        return_type: SeqNo
        description: "Returns the newer of this and other using modular comparison. When equal, returns other."
      - name: min
        params:
          - name: other
            type: SeqNo
        return_type: SeqNo
        description: "Returns the older of this and other using modular comparison. When equal, returns other."
      - name: unsignedDistance
        params:
          - name: other
            type: SeqNo
        return_type: UInt
        description: "Modular unsigned forward distance from other to this (this - other) in UInt arithmetic with natural wraparound. Useful for route staleness diagnostics and gap analysis."

  - name: Scoreboard
    package: ch.trancee.meshlink.model
    type: class
    description: "Immutable bitfield for selective acknowledgment (SACK). Bit N = 1 means chunk N received. Length is ceil(totalChunks / 8) bytes. Counts (receivedCount, missingCount, isComplete) are O(1) via cached incremental tracking. Immutable markReceived/markMissing return new instances for thread-safe sharing."
    constructors:
      - name: Scoreboard(totalChunks: UInt)
        description: "Dynamic bitfield sized for the actual chunk count."
      - name: Scoreboard(totalChunks: UInt, maxChunksPerSession: UInt)
        description: "FIXED encoding — pre-allocates a byte array sized for maxChunksPerSession. Used when totalChunks is unknown upfront but an upper bound is known. Only bits 0..totalChunks-1 carry meaning."
    fields:
      - name: totalChunks
        type: UInt
        description: "Total number of chunks in this transfer"
      - name: byteSize
        type: Int
        description: "Number of bytes in the underlying bitfield — for wire-frame sizing"
      - name: receivedCount
        type: Int
        description: "O(1) — cached; updated incrementally on markReceived/markMissing"
      - name: missingCount
        type: Int
        description: "O(1) — derived as totalChunks - receivedCount"
      - name: isComplete
        type: Boolean
        description: "O(1) — true when all chunks received"
    functions:
      - name: markReceived
        params:
          - name: index
            type: Int
        return_type: Scoreboard
        description: "Marks chunk index as received. Returns a new Scoreboard. Throws IndexOutOfBoundsException if index >= totalChunks."
      - name: markMissing
        params:
          - name: index
            type: Int
        return_type: Scoreboard
        description: "Marks chunk index as missing. Returns a new Scoreboard. Throws IndexOutOfBoundsException if index >= totalChunks."
      - name: isReceived
        params:
          - name: index
            type: Int
        return_type: Boolean
        description: "Returns true if chunk index received. Throws IndexOutOfBoundsException if out of range."
      - name: isMissing
        params:
          - name: index
            type: Int
        return_type: Boolean
        description: "Returns true if chunk index not received. Throws IndexOutOfBoundsException if out of range."
      - name: missingChunks
        return_type: List<Int>
        description: "Allocates a list of missing chunk indices. Use missingSequence or forEachMissing for zero-allocation alternatives."
      - name: missingSequence
        return_type: Sequence<Int>
        description: "Lazy sequence of missing chunk indices — no list allocation."
      - name: forEachMissing
        params:
          - name: action
            type: "(index: Int) -> Unit"
        return_type: Unit
        description: "Zero-allocation iteration over missing chunks via inline callback."
      - name: or
        params:
          - name: other
            type: Scoreboard
        return_type: Scoreboard
        description: "Merges ACK bitfields from multiple mesh peers (union of received chunks). Both scoreboards must have matching totalChunks and byteSize."
      - name: and
        params:
          - name: other
            type: Scoreboard
        return_type: Scoreboard
        description: "Intersects ACK bitfields (chunks received by ALL peers). Both scoreboards must have matching totalChunks and byteSize."
      - name: xor
        params:
          - name: other
            type: Scoreboard
        return_type: Scoreboard
        description: "Symmetric difference of ACK bitfields (chunks received by exactly one peer). Both scoreboards must have matching totalChunks and byteSize."
      - name: toByteArray
        return_type: ByteArray
        description: "Returns a defensive copy of the raw bitfield for wire transmission."

  - name: MutableScoreboard
    package: ch.trancee.meshlink.model
    type: class
    description: "High-performance mutable accumulator for chunk receipt tracking in hot paths (e.g. burst ACK processing). O(1) counts tracked incrementally. Call toImmutable for thread-safe snapshot."
    fields:
      - name: totalChunks
        type: UInt
        description: "Total number of chunks in this transfer"
      - name: receivedCount
        type: Int
        description: "O(1) cached count, updated incrementally"
      - name: missingCount
        type: Int
        description: "O(1) derived count"
      - name: isComplete
        type: Boolean
        description: "O(1) — true when all chunks received"
    functions:
      - name: markReceived
        params:
          - name: index
            type: Int
        return_type: Unit
        description: "Marks chunk index as received in-place. Throws IndexOutOfBoundsException if index out of range."
      - name: markMissing
        params:
          - name: index
            type: Int
        return_type: Unit
        description: "Marks chunk index as missing in-place. Throws IndexOutOfBoundsException if index out of range."
      - name: isReceived
        params:
          - name: index
            type: Int
        return_type: Boolean
        description: "Returns true if chunk index received. Throws IndexOutOfBoundsException if out of range."
      - name: isMissing
        params:
          - name: index
            type: Int
        return_type: Boolean
        description: "Returns true if chunk index not received. Throws IndexOutOfBoundsException if out of range."
      - name: receivedCount
        return_type: Int
        description: "O(1) cached count."
      - name: missingCount
        return_type: Int
        description: "O(1) derived count."
      - name: isComplete
        return_type: Boolean
        description: "O(1) — true when every chunk received."
      - name: toImmutable
        return_type: Scoreboard
        description: "Converts to an immutable snapshot for transfer state."

  - name: RouteEntry
    package: ch.trancee.meshlink.model
    type: data_class
    description: "Route entry in the routing table. Managed by RouteCoordinator; updates via RouteDigest."
    fields:
      - name: source
        type: PeerIdentity
        description: "The peer from whom this route was learned (for loop detection)"
      - name: destination
        type: PeerIdentity
        description: "Final destination peer in the mesh"
      - name: nextHop
        type: "PeerIdentity?"
        description: "Immediate next hop toward the destination (null = unreachable)"
      - name: metric
        type: UInt
        description: "Route metric (RSSI + flags, see LinkMetric)"
      - name: seqNo
        type: SeqNo
        description: "Destination-self-reported sequence number, wrapped for safe comparison"
      - name: identityKey
        type: "IdentityKey?"
        description: "Destination's Ed25519 identity key, learned via route updates (may be null on cold start)"
      - name: handshakeKey
        type: "HandshakeKey?"
        description: "Destination's X25519 handshake key, learned via route updates (may be null on cold start)"
      - name: expiresAt
        type: Instant
        description: "Expiration instant for this route entry"

  - name: TransferSession
    package: ch.trancee.meshlink.model
    type: data_class
    description: "Drives chunked transfer with selective ACK and cut-through relay support. Chunk size is selected by the local PowerMode at session start and bounded by the peer's advertised MTU. Scoreboard uses a dynamic bitfield whose length is derived from totalChunks — bit N = 1 means chunk N is received (standard SACK)."
    fields:
      - name: sessionId
        type: SessionId
        description: "Unique 64-bit token identifying this transfer session"
      - name: destination
        type: PeerIdentity
        description: "Final destination peer for this transfer"
      - name: priority
        type: Priority
        description: "QoS priority inherited from the originating RoutingMessage"
      - name: state
        type: TransferState
        description: "Current lifecycle state of this transfer"
      - name: chunkSize
        type: Int
        description: "Selected chunk size in bytes (bounded by peer MTU)"
      - name: totalChunks
        type: UInt
        description: "Total number of chunks in this transfer"
      - name: scoreboard
        type: Scoreboard
        description: "Tracks which chunks have been received via SACK bitfield"
      - name: totalBytes
        type: Long
        description: "Total payload size in bytes"
      - name: bytesReceived
        type: Long
        description: "Bytes received so far"
      - name: startedAt
        type: Instant
        description: "When this transfer session was started"
      - name: expiresAt
        type: "Instant?"
        description: "Deadline for WAITING_FOR_ROUTE state; null when in-progress or retrying"
      - name: retryCount
        type: Int
        description: "Number of retransmit attempts made so far"
      - name: failureReason
        type: "TransferFailureReason?"
        description: "Why this session reached a terminal failure state"

  - name: SessionId
    package: ch.trancee.meshlink.model
    type: value_class
    description: "Unique 64-bit token identifying a transfer session."
    fields:
      - name: value
        type: ULong
        visibility: private
        description: "Raw 64-bit session ID value"
    methods:
      - name: toString
        return_type: String
        description: "Hex representation of the 64-bit value"
    companion_functions:
      - name: fromHex
        params:
          - name: hex
            type: String
        return_type: SessionId
        description: "Creates a SessionId from a hex string (max 16 chars)"

  - name: TransferFailureReason
    package: ch.trancee.meshlink.model
    type: sealed_interface
    description: "Why a transfer session reached a terminal failure state. Distinguishes trust failures from generic unrecoverable failures."
    subtypes:
      - name: Unrecoverable
        type: data_class
        fields:
          - name: message
            type: String
        description: "Generic error, cancel, retry budget exhausted, or non-trust transfer failure"
      - name: TrustFailure
        type: data_class
        fields:
          - name: peerIdentity
            type: PeerIdentity
        description: "Trust-related failure (e.g. identity mismatch, revoked peer)"

  - name: LinkMetric
    package: ch.trancee.meshlink.model
    type: class
    description: "Encapsulates the metric bit layout: low byte = RSSI normalized (0-255), high bits = flags (supportsL2CAP, lowLatency, highPower). Composite serialized form: (flags shl 8) or rssiNormalized."
    fields:
      - name: rssiNormalized
        type: UByte
        description: "RSSI normalized to 0-255 (low byte)"
      - name: supportsL2CAP
        type: Boolean
        description: "Bit 8: L2CAP CoC supported"
      - name: lowLatency
        type: Boolean
        description: "Bit 9: Low-latency (short) connection interval"
      - name: highPower
        type: Boolean
        description: "Bit 10: High power mode"
      - name: composite
        type: UInt
        description: "Serialized form: (flags shl 8) or rssiNormalized"

  - name: IdentityKey
    package: ch.trancee.meshlink.model
    type: value_class
    description: "Ed25519 public key for mesh identity verification and signing. Stored as a 32-byte array, serialized as hex string."
    fields:
      - name: bytes
        type: ByteArray
        visibility: private
        description: "Raw 32-byte Ed25519 key data"
    methods:
      - name: toString
        return_type: String
        description: "Hex-encoded representation"
    companion_functions:
      - name: fromHex
        params:
          - name: hex
            type: String
        return_type: IdentityKey
        description: "Creates an IdentityKey from a 64-char hex string"
      - name: fromBytes
        params:
          - name: bytes
            type: ByteArray
        return_type: IdentityKey
        description: "Creates an IdentityKey from a 32-byte ByteArray"
      - name: toByteArray
        return_type: ByteArray
        description: "Returns the raw key bytes"

  - name: HandshakeKey
    package: ch.trancee.meshlink.model
    type: value_class
    description: "X25519 Diffie-Hellman public key for Noise handshake key exchange. Stored as a 32-byte array, serialized as hex string."
    fields:
      - name: bytes
        type: ByteArray
        visibility: private
        description: "Raw 32-byte X25519 key data"
    methods:
      - name: toString
        return_type: String
        description: "Hex-encoded representation"
    companion_functions:
      - name: fromHex
        params:
          - name: hex
            type: String
        return_type: HandshakeKey
        description: "Creates a HandshakeKey from a 64-char hex string"
      - name: fromBytes
        params:
          - name: bytes
            type: ByteArray
        return_type: HandshakeKey
        description: "Creates a HandshakeKey from a 32-byte ByteArray"
      - name: toByteArray
        return_type: ByteArray
        description: "Returns the raw key bytes"