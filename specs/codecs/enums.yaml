# MeshLink Wire Codec — Enum Contracts
# Authored normative source for storage widths, explicit codes, reserved ranges, and unknown handling.
# Enum declaration ordinal is never a wire value.
# SPEC-ANCHOR: type-model

enums:
  - name: KeyType
    package: ch.trancee.meshlink.model
    description: "Distinguishes Ed25519 (identity/signing) keys from X25519 (DH) keys."
    values:
      - name: ED25519
        ordinal: 0
      - name: X25519
        ordinal: 1

  - name: KeyRotationReason
    package: ch.trancee.meshlink.model
    description: "Reason a key rotation was triggered."
    values:
      - name: PERIODIC
        ordinal: 0
      - name: MANUAL
        ordinal: 1
      - name: SECURITY_EVENT
        ordinal: 2

  - name: HandshakePattern
    package: ch.trancee.meshlink.model
    description: "Noise handshake pattern selected by trust state for link-layer and end-to-end sessions."
    values:
      - name: XX
        ordinal: 0
        description: "First contact when no trusted destination pin exists"
      - name: IK
        ordinal: 1
        description: "Reconnect when a trusted current destination pin exists"

  - name: Priority
    package: ch.trancee.meshlink.model
    description: "Delivery scheduling priority and default elapsed timeToLive. Priority never changes maximumHopCount."
    values:
      - name: HIGH
        ordinal: 0
        default_time_to_live_minutes: 10
      - name: NORMAL
        ordinal: 1
        default_time_to_live_minutes: 5
      - name: LOW
        ordinal: 2
        default_time_to_live_minutes: 1

  - name: FrameType
    package: ch.trancee.meshlink.wire
    visibility: internal
    description: "Explicit UByte wire codes grouped by protocol area; encoding never uses enum ordinal."
    values:
      - name: MESH_ENVELOPE
        code: "0x00"
        encryption: "Hop AEAD per relay path"
      - name: ROUTE_ADVERTISEMENT
        code: "0x01"
        encryption: "Hop AEAD plus destination-signed RouteStatement"
      - name: ROUTE_WITHDRAWAL
        code: "0x02"
        encryption: "Hop AEAD"
      - name: ROUTE_DIGEST
        code: "0x03"
        encryption: "Hop AEAD"
      - name: ROUTE_SEQUENCE_ADVANCEMENT
        code: "0x04"
        encryption: "Hop AEAD"
      - name: ROUTE_SYNCHRONIZATION
        code: "0x05"
        encryption: "Hop AEAD"
      - name: ROUTE_SNAPSHOT
        code: "0x06"
        encryption: "Hop AEAD"
      - name: PAYLOAD_MANIFEST
        code: "0x20"
        encryption: "E2E Noise inside hop AEAD"
      - name: PAYLOAD_DECISION
        code: "0x21"
        encryption: "E2E Noise inside hop AEAD"
      - name: PAYLOAD_CHUNK
        code: "0x22"
        encryption: "E2E Noise inside hop AEAD"
      - name: PAYLOAD_ACKNOWLEDGEMENT
        code: "0x23"
        encryption: "E2E Noise inside hop AEAD"
      - name: PAYLOAD_CANCELLATION
        code: "0x24"
        encryption: "E2E Noise inside hop AEAD"
      - name: KEY_ROTATION
        code: "0x40"
        encryption: "Hop AEAD plus end-to-end dual signatures"
      - name: EPOCH_COMMIT
        code: "0x41"
        encryption: "Pending new-epoch AEAD"
      - name: EPOCH_ACKNOWLEDGEMENT
        code: "0x42"
        encryption: "Pending new-epoch AEAD"

  - name: PayloadKind
    package: ch.trancee.meshlink.transfer
    visibility: internal
    storage: UByte
    unknown: reject
    values:
      - name: MESSAGE
        code: "0x00"
      - name: TRANSFER
        code: "0x01"

  - name: PayloadDecision
    package: ch.trancee.meshlink.transfer
    visibility: internal
    storage: UByte
    unknown: reject
    values:
      - name: ACCEPTED
        code: "0x00"
      - name: REJECTED
        code: "0x01"

  - name: TransferFailureReason
    package: ch.trancee.meshlink.model
    visibility: internal
    storage: UByte
    values:
      - name: ACCEPTANCE_TIMEOUT
        code: "0x00"
      - name: RECEIVER_BUSY
        code: "0x01"
      - name: RECEIVER_UNAVAILABLE
        code: "0x02"
      - name: SINK_UNAVAILABLE
        code: "0x03"
      - name: MESSAGE_TOO_LARGE
        code: "0x04"
      - name: TRUST_FAILURE
        code: "0x05"
      - name: INVALID_MANIFEST
        code: "0x06"
      - name: INSUFFICIENT_STORAGE
        code: "0x07"
      - name: POLICY_REJECTED
        code: "0x08"

  - name: DecryptFailureReason
    package: ch.trancee.meshlink.model
    description: "Why a routed frame failed to decrypt at the link layer."
    values:
      - name: AUTHENTICATION_TAG_MISMATCH
        ordinal: 0
      - name: REPLAY_DETECTED
        ordinal: 1
      - name: SEQUENCE_NUMBER_MISMATCH
        ordinal: 2
      - name: KEY_UNAVAILABLE
        ordinal: 3
      - name: MALFORMED_FRAME
        ordinal: 4

  - name: TransportFallbackReason
    package: ch.trancee.meshlink.model
    description: "Why the data plane fell back from L2CAP CoC to GATT."
    values:
      - name: L2CAP_UNAVAILABLE
        ordinal: 0
      - name: L2CAP_CONNECT_FAILED
        ordinal: 1
      - name: L2CAP_OPEN_TIMEOUT
        ordinal: 2
      - name: L2CAP_STREAM_ERROR
        ordinal: 3
      - name: L2CAP_STALLED
        ordinal: 4
      - name: L2CAP_DROPPED_MID_TRANSFER
        ordinal: 5
      - name: LOCAL_POLICY
        ordinal: 6

  - name: DataPlaneBearer
    package: ch.trancee.meshlink.model
    description: "Data plane bearer in use for a transfer session."
    values:
      - name: GATT
        ordinal: 0
      - name: L2CAP
        ordinal: 1

  - name: L2capState
    package: ch.trancee.meshlink.transport
    visibility: internal
    description: "Capability and process-local health state for one adjacent L2CAP channel."
    values:
      - name: UNSUPPORTED
        ordinal: 0
      - name: AVAILABLE
        ordinal: 1
      - name: CONNECTING
        ordinal: 2
      - name: ACTIVE
        ordinal: 3
      - name: BACKING_OFF
        ordinal: 4
      - name: DISABLED
        ordinal: 5

  - name: RegulatoryRegion
    package: ch.trancee.meshlink.model
    description: "Regulatory region controlling BLE radio policy clamping."
    values:
      - name: DEFAULT
        ordinal: 0
        description: "Rely on platform BLE stack behavior"
      - name: EU
        ordinal: 1
        description: "Apply EU clamping (adv interval >= 300ms, scan duty cycle <= 70%)"

  - name: NoiseLayer
    package: ch.trancee.meshlink.model
    description: "Which layer of the mesh a Noise session belongs to."
    values:
      - name: HOP_BY_HOP
        ordinal: 0
      - name: END_TO_END
        ordinal: 1

  - name: NoiseSessionState
    package: ch.trancee.meshlink.model
    description: "Noise link-layer session states."
    values:
      - name: DISCONNECTED
        ordinal: 0
      - name: HANDSHAKING_XX
        ordinal: 1
      - name: HANDSHAKING_IK
        ordinal: 2
      - name: ESTABLISHED
        ordinal: 3
      - name: RENEWING
        ordinal: 4
      - name: FAILED
        ordinal: 5

  - name: NoiseRole
    package: ch.trancee.meshlink.model
    description: "Role in a Noise handshake."
    values:
      - name: INITIATOR
        ordinal: 0
      - name: RESPONDER
        ordinal: 1

  - name: NoiseFailureReason
    package: ch.trancee.meshlink.model
    description: "Reason a Noise handshake failed."
    values:
      - name: HANDSHAKE_TIMEOUT
        ordinal: 0
      - name: HANDSHAKE_MESSAGE_MALFORMED
        ordinal: 1
      - name: HANDSHAKE_MESSAGE_OUT_OF_ORDER
        ordinal: 2
      - name: REMOTE_STATIC_KEY_MISMATCH
        ordinal: 3
      - name: REMOTE_STATIC_KEY_UNKNOWN
        ordinal: 4
      - name: REKEY_REJECTED
        ordinal: 5
      - name: TRANSPORT_CLOSED
        ordinal: 6
      - name: MAX_RETRIES_EXCEEDED
        ordinal: 7
      - name: INTERNAL_ERROR
        ordinal: 8

  - name: PowerMode
    package: ch.trancee.meshlink.model
    description: "Power mode governing scan duty cycle, advertisement interval, connection interval, concurrent connections, and transfer chunk size."
    values:
      - name: HIGH
        ordinal: 0
        scan_duty_cycle_percent: 20
        adv_interval_ms: 100
        conn_interval_min_ms: 7.5
        conn_interval_max_ms: 15
        max_concurrent: 8
        chunk_size_bytes: 512
        max_retries: 10
        retry_budget_seconds: 60
        grace_period_seconds: 15
      - name: MEDIUM
        ordinal: 1
        scan_duty_cycle_percent: 10
        adv_interval_ms: 500
        conn_interval_min_ms: 15
        conn_interval_max_ms: 30
        max_concurrent: 4
        chunk_size_bytes: 256
        max_retries: 5
        retry_budget_seconds: 30
        grace_period_seconds: 30
      - name: LOW
        ordinal: 2
        scan_duty_cycle_percent: 5
        adv_interval_ms: 1000
        conn_interval_min_ms: 30
        conn_interval_max_ms: 60
        max_concurrent: 2
        chunk_size_bytes: 128
        max_retries: 3
        retry_budget_seconds: 15
        grace_period_seconds: 45

  - name: TransferState
    package: ch.trancee.meshlink.model
    description: "Public finite payload operation state."
    values:
      - name: AWAITING_DECISION
        ordinal: 0
        terminal: false
      - name: TRANSFERRING
        ordinal: 1
        terminal: false
      - name: ROUTE_UNAVAILABLE
        ordinal: 2
        terminal: false
      - name: RETRANSMITTING
        ordinal: 3
        terminal: false
      - name: COMPLETED
        ordinal: 4
        terminal: true
      - name: CANCELLED
        ordinal: 5
        terminal: true
      - name: FAILED
        ordinal: 6
        terminal: true
      - name: EXPIRED
        ordinal: 7
        terminal: true

  - name: PeerState
    package: ch.trancee.meshlink
    description: "Public peer connection states exposed to host apps."
    values:
      - name: CONNECTED
        ordinal: 0
      - name: DISCONNECTED
        ordinal: 1

  - name: VerificationLevel
    package: ch.trancee.meshlink.model
    description: "Verification level achieved during handshake."
    values:
      - name: FULL
        ordinal: 0
        description: "Current signed identity binding verified against an existing trusted pin"
      - name: TOFU_PIN
        ordinal: 1
        description: "First-contact signed identity binding verified and pinned after Noise XX"
      - name: NONE
        ordinal: 2
        description: "No verification — handshake failed or was rejected"