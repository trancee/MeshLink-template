# MeshLink Wire Codec — Enum Contracts
# Authored normative source for storage widths, explicit codes, reserved ranges, and unknown handling.
# Enum declaration ordinal is never a wire value.
# SPEC-ANCHOR: type-model

enums:
  - name: KeyType
    package: ch.trancee.meshlink.model
    description: "Distinguishes Ed25519 (identity/signing) keys from X25519 (DH) keys."
    values:
      - name: ED25519
        ordinal: 0
      - name: X25519
        ordinal: 1

  - name: KeyRotationReason
    package: ch.trancee.meshlink.model
    description: "Reason a key rotation was triggered."
    values:
      - name: PERIODIC
        ordinal: 0
      - name: MANUAL
        ordinal: 1
      - name: SECURITY_EVENT
        ordinal: 2

  - name: HandshakePattern
    package: ch.trancee.meshlink.model
    description: "Noise handshake pattern selected by trust state for link-layer and end-to-end sessions."
    values:
      - name: XX
        ordinal: 0
        description: "First contact when no trusted destination pin exists"
      - name: IK
        ordinal: 1
        description: "Reconnect when a trusted current destination pin exists"

  - name: Priority
    package: ch.trancee.meshlink.model
    description: "Delivery scheduling priority and default elapsed timeToLive. Priority never changes maximumHopCount."
    values:
      - name: HIGH
        ordinal: 0
        defaultTimeToLiveMinutes: 10
      - name: NORMAL
        ordinal: 1
        defaultTimeToLiveMinutes: 5
      - name: LOW
        ordinal: 2
        defaultTimeToLiveMinutes: 1

  - name: FrameType
    package: ch.trancee.meshlink.wire
    visibility: public
    description: "Explicit UByte wire codes grouped by protocol area; encoding never uses enum ordinal."
    values:
      - name: MESH_ENVELOPE
        code: "0x00"
        encryption: "Hop AEAD per relay path"
      - name: ROUTE_ADVERTISEMENT
        code: "0x01"
        encryption: "Hop AEAD plus destination-signed RouteStatement"
      - name: ROUTE_WITHDRAWAL
        code: "0x02"
        encryption: "Hop AEAD"
      - name: ROUTE_DIGEST
        code: "0x03"
        encryption: "Hop AEAD"
      - name: ROUTE_SEQUENCE_ADVANCEMENT
        code: "0x04"
        encryption: "Hop AEAD"
      - name: ROUTE_SYNCHRONIZATION
        code: "0x05"
        encryption: "Hop AEAD"
      - name: ROUTE_SNAPSHOT
        code: "0x06"
        encryption: "Hop AEAD"
      - name: PAYLOAD_MANIFEST
        code: "0x20"
        encryption: "E2E Noise inside hop AEAD"
      - name: PAYLOAD_DECISION
        code: "0x21"
        encryption: "E2E Noise inside hop AEAD"
      - name: PAYLOAD_CHUNK
        code: "0x22"
        encryption: "E2E Noise inside hop AEAD"
      - name: PAYLOAD_ACKNOWLEDGEMENT
        code: "0x23"
        encryption: "E2E Noise inside hop AEAD"
      - name: PAYLOAD_CANCELLATION
        code: "0x24"
        encryption: "E2E Noise inside hop AEAD"
      - name: KEY_ROTATION
        code: "0x40"
        encryption: "Hop AEAD plus end-to-end dual signatures"
      - name: EPOCH_COMMIT
        code: "0x41"
        encryption: "Pending new-epoch AEAD"
      - name: EPOCH_ACKNOWLEDGEMENT
        code: "0x42"
        encryption: "Pending new-epoch AEAD"

  - name: TransferKind
    package: ch.trancee.meshlink.transfer
    visibility: internal
    storage: UByte
    unknown: reject
    values:
      - name: MESSAGE
        code: "0x00"
      - name: PAYLOAD
        code: "0x01"

  - name: PayloadDecision
    package: ch.trancee.meshlink.transfer
    visibility: internal
    storage: UByte
    unknown: reject
    values:
      - name: ACCEPTED
        code: "0x00"
      - name: REJECTED
        code: "0x01"

  - name: DecryptFailureReason
    package: ch.trancee.meshlink.model
    description: "Why a routed frame failed to decrypt at the link layer."
    values:
      - name: AUTHENTICATION_TAG_MISMATCH
        ordinal: 0
      - name: REPLAY_DETECTED
        ordinal: 1
      - name: SEQUENCE_NUMBER_MISMATCH
        ordinal: 2
      - name: KEY_UNAVAILABLE
        ordinal: 3
      - name: MALFORMED_FRAME
        ordinal: 4

  - name: TransportFallbackReason
    package: ch.trancee.meshlink.model
    description: "Why the data plane fell back from L2CAP CoC to GATT."
    values:
      - name: L2CAP_UNAVAILABLE
        ordinal: 0
      - name: L2CAP_CONNECT_FAILED
        ordinal: 1
      - name: L2CAP_OPEN_TIMEOUT
        ordinal: 2
      - name: L2CAP_STREAM_ERROR
        ordinal: 3
      - name: L2CAP_STALLED
        ordinal: 4
      - name: L2CAP_DROPPED_MID_TRANSFER
        ordinal: 5
      - name: LOCAL_POLICY
        ordinal: 6
  - name: TransferResult
    package: ch.trancee.meshlink.model
    visibility: public
    description: "Terminal payload transfer result surfaced to host apps."
    values:
      - name: COMPLETED
        ordinal: 0
      - name: CANCELLED
        ordinal: 1
      - name: EXPIRED
        ordinal: 2
      - name: UNRECOVERABLE_FAILURE
        ordinal: 3
      - name: TRUST_FAILURE
        ordinal: 4

  - name: TransportLayer
    package: ch.trancee.meshlink.model
    description: "Data plane bearer in use for a transfer session."
    values:
      - name: GATT
        ordinal: 0
      - name: L2CAP
        ordinal: 1

  - name: L2capState
    package: ch.trancee.meshlink.transport
    visibility: internal
    description: "Capability and process-local health state for one adjacent L2CAP channel."
    values:
      - name: UNSUPPORTED
        ordinal: 0
      - name: AVAILABLE
        ordinal: 1
      - name: CONNECTING
        ordinal: 2
      - name: ACTIVE
        ordinal: 3
      - name: BACKING_OFF
        ordinal: 4
      - name: DISABLED
        ordinal: 5

  - name: RegulatoryRegion
    package: ch.trancee.meshlink.model
    description: "Regulatory region controlling BLE radio policy clamping."
    values:
      - name: DEFAULT
        ordinal: 0
        description: "Rely on platform BLE stack behavior"
      - name: EU
        ordinal: 1
        description: "Apply EU clamping (adv interval >= 300ms, scan duty cycle <= 70%)"

  - name: NoiseLayer
    package: ch.trancee.meshlink.model
    description: "Which layer of the mesh a Noise session belongs to."
    values:
      - name: HOP_BY_HOP
        ordinal: 0
      - name: END_TO_END
        ordinal: 1

  - name: NoiseSessionState
    package: ch.trancee.meshlink.model
    description: "Noise link-layer session states."
    values:
      - name: DISCONNECTED
        ordinal: 0
      - name: HANDSHAKING_XX
        ordinal: 1
      - name: HANDSHAKING_IK
        ordinal: 2
      - name: ESTABLISHED
        ordinal: 3
      - name: RENEWING
        ordinal: 4
      - name: FAILED
        ordinal: 5

  - name: NoiseRole
    package: ch.trancee.meshlink.model
    description: "Role in a Noise handshake."
    values:
      - name: INITIATOR
        ordinal: 0
      - name: RESPONDER
        ordinal: 1

  - name: NoiseFailureReason
    package: ch.trancee.meshlink.model
    description: "Reason a Noise handshake failed."
    values:
      - name: HANDSHAKE_TIMEOUT
        ordinal: 0
      - name: HANDSHAKE_MESSAGE_MALFORMED
        ordinal: 1
      - name: HANDSHAKE_MESSAGE_OUT_OF_ORDER
        ordinal: 2
      - name: REMOTE_STATIC_KEY_MISMATCH
        ordinal: 3
      - name: REMOTE_STATIC_KEY_UNKNOWN
        ordinal: 4
      - name: REKEY_REJECTED
        ordinal: 5
      - name: TRANSPORT_CLOSED
        ordinal: 6
      - name: MAX_RETRIES_EXCEEDED
        ordinal: 7
      - name: INTERNAL_ERROR
        ordinal: 8

  - name: PowerMode
    package: ch.trancee.meshlink.model
    description: "Power mode governing scan duty cycle, advertisement interval, connection interval, concurrent connections, and transfer chunk size."
    values:
      - name: HIGH
        ordinal: 0
        scanDutyCycle: 20
        advertisementInterval: 100
        activeConnectionInterval: 7.5
        idleConnectionInterval: 15
        concurrentConnectionLimit: 8
        chunkSize: 512
        retryLimit: 10
        retryBudget: 60
        disconnectGracePeriod: 15
      - name: MEDIUM
        ordinal: 1
        scanDutyCycle: 10
        advertisementInterval: 500
        activeConnectionInterval: 15
        idleConnectionInterval: 30
        concurrentConnectionLimit: 4
        chunkSize: 256
        retryLimit: 5
        retryBudget: 30
        disconnectGracePeriod: 30
      - name: LOW
        ordinal: 2
        scanDutyCycle: 5
        advertisementInterval: 1000
        activeConnectionInterval: 30
        idleConnectionInterval: 60
        concurrentConnectionLimit: 2
        chunkSize: 128
        retryLimit: 3
        retryBudget: 15
        disconnectGracePeriod: 45

  - name: TransferState
    package: ch.trancee.meshlink.model
    description: "Public finite payload operation state."
    values:
      - name: AWAITING_DECISION
        ordinal: 0
        terminal: false
      - name: TRANSFERRING
        ordinal: 1
        terminal: false
      - name: ROUTE_UNAVAILABLE
        ordinal: 2
        terminal: false
      - name: RETRANSMITTING
        ordinal: 3
        terminal: false
      - name: COMPLETED
        ordinal: 4
        terminal: true
      - name: CANCELLED
        ordinal: 5
        terminal: true
      - name: FAILED
        ordinal: 6
        terminal: true
      - name: EXPIRED
        ordinal: 7
        terminal: true

  - name: PeerState
    package: ch.trancee.meshlink.model
    description: "Public peer connection states exposed to host apps."
    values:
      - name: CONNECTED
        ordinal: 0
      - name: DISCONNECTED
        ordinal: 1

  - name: PeerTrust
    package: ch.trancee.meshlink.model
    visibility: public
    description: "Trust classification of a known peer."
    values:
      - name: UNVERIFIED
        ordinal: 0
        description: "Identity discovered but not yet authenticating or verified"
      - name: VERIFYING
        ordinal: 1
        description: "Handshake in progress, not yet verified"
      - name: TRUSTED
        ordinal: 2
        description: "TOFU-pinned identity (first successful handshake)"
      - name: MISMATCHED
        ordinal: 3
        description: "Identity mismatch detected — remote key does not match existing pin"
      - name: REVOKED
        ordinal: 4
        description: "Explicitly revoked by user/application"

  - name: MeshLinkState
    package: ch.trancee.meshlink.model
    visibility: public
    description: "MeshLink instance lifecycle state."
    values:
      - name: UNINITIALIZED
        ordinal: 0
        description: "Instance created but not yet constructed with settings"
      - name: CONFIGURED
        ordinal: 1
        description: "Instance constructed with settings; start() not yet called"
      - name: RUNNING
        ordinal: 2
        description: "Instance started and active"
      - name: PAUSED
        ordinal: 3
        description: "Instance temporarily suspended"
      - name: STOPPED
        ordinal: 4
        description: "Instance stopped and resources released"

  - name: DiagnosticSeverity
    package: ch.trancee.meshlink.model
    visibility: public
    description: "Severity level for diagnostic events, aligned with platform logging tiers."
    values:
      - name: DEBUG
        ordinal: 0
      - name: INFO
        ordinal: 1
      - name: WARN
        ordinal: 2
      - name: ERROR
        ordinal: 3

  - name: KeyRotationState
    package: ch.trancee.meshlink.model
    visibility: internal
    description: "Per-peer key rotation status."
    values:
      - name: CURRENT
        ordinal: 0
        description: "Key is active and current"
      - name: GRACE_PERIOD
        ordinal: 1
        description: "Old key retained for grace period after rotation"
      - name: REVOKED
        ordinal: 2
        description: "Key fully revoked, no longer accepted"

  - name: PeerLifecycle
    package: ch.trancee.meshlink.model
    visibility: internal
    description: "Internal runtime tracking type driving peer lifecycle."
    values:
      - name: CONNECTED
        ordinal: 0
        description: "Active BLE link"
      - name: DISCONNECTED
        ordinal: 1
        description: "BLE link lost; grace period active"
      - name: GONE
        ordinal: 2
        terminal: true
        description: "Grace window expired; ephemeral cleanup"

  - name: VerificationLevel
    package: ch.trancee.meshlink.model
    description: "Verification level achieved during handshake."
    values:
      - name: FULL
        ordinal: 0
        description: "Current signed identity binding verified against an existing trusted pin"
      - name: TOFU_PIN
        ordinal: 1
        description: "First-contact signed identity binding verified and pinned after Noise XX"
      - name: NONE
        ordinal: 2
        description: "No verification — handshake failed or was rejected"