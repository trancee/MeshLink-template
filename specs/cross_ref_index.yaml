implementation_status:
  implemented:
    - "PeerIdentity"
    - "SeqNo"
    - "Scoreboard / MutableScoreboard"
    - "RouteEntry"
    - "TransferSession / TransferState / TransferFailureReason"
    - "SessionId"
    - "LinkMetric"
    - "IdentityKey"
    - "PeerConnectionState"
    - "PeerEvent"
    - "All enums in TypeModel.kt"
    - "DiagnosticEvent sealed hierarchy"
    - "PowerMode"
    - "HandshakeKey"
    - "RoutingPolicy (TTL by priority)"
  not_implemented:
    - "MeshLink public API (MeshLink.kt is stub)"
    - "RouteCoordinator"
    - "RouteDigestTracker"
    - "RouteAdvertisementPlanner"
    - "TransferCoordinator"
    - "Noise handshake implementations (XX, IK, IX, NX)"
    - "CryptoProvider (X25519, Ed25519, ChaCha20-Poly1305, HKDF, HMAC)"
    - "BLE transport layer (GATT/L2CAP)"
    - "KeyRotationAnnouncement handling"
    - "TrustStore"
    - "PeerStateCoordinator"
    - "MeshLinkSettings DSL integration"
    - "Virtual mesh harness"
    - "Wire codec (FlatBuffers-compatible)"

