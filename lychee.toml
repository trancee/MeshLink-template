# Config for lychee (link checker) — see scripts/check-markdown.sh and
# docs/how-to/bootstrap-project-tooling.md.
exclude_path = [
    ".agents/",
    ".git/"
]

exclude = [
    "^https?://(www\\.)?gsmarena\\.com",
    "^https?://(www\\.)?devicespecifications\\.com"
]

# Retry transient network failures a few times before failing CI.
max_retries = 3
retry_wait_time = 2
timeout = 20

# Treat 429 (rate limit) as a source of retries, not an immediate failure.
accept = ["100..=103", "200..=299", "429"]
