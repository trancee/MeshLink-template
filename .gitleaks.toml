# Gitleaks config for MeshLink.
#
# Extends gitleaks' built-in default rule set (secret-pattern detection) and
# adds repository-specific path excludes on top of it.
[extend]
useDefault = true

[allowlist]
# docs/rfcs/ holds vendored, unmodified copies of external IETF/IRTF spec
# texts (see docs/README.md) — not MeshLink's own content, so it's excluded
# from secret scanning like any other vendored/third-party material.
#
# .agents/ holds vendored agent skill files, also third-party/vendored
# content rather than MeshLink's own code or docs.
paths = [
  '''docs/rfcs/.*''',
  '''\.agents/.*''',
]
