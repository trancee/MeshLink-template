name: Copilot Setup Steps

# Sets up the JDK, Gradle, and project dependencies so that Copilot
# can build and test MeshLink in-code. Mirrors the toolchain used by
# .github/workflows/ci.yml (authoritative).
#
# See AGENTS.md and docs/how-to/bootstrap-project-tooling.md.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/copilot-setup-steps.yml'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'meshlink/build.gradle.kts'

jobs:
  copilot-setup:
    name: Copilot environment setup
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Install codebase-memory-mcp
        run: npm install -g codebase-memory-mcp

      - name: Verify project builds
        run: ./gradlew --console=plain :meshlink:build --no-daemon
