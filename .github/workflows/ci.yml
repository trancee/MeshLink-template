---
name: CI

# Authoritative quality gate — see CONSTITUTION.md Quality Gates.
# .githooks/pre-commit and pre-push mirror a fast local subset of these
# checks; passing them locally does not guarantee this workflow passes.
#
# NOTE: this is a first-draft scaffold written before the Gradle project
# exists. Task names mirror .githooks/ conventions and standard Gradle
# plugin conventions (ktfmt, Detekt, Kover, Kotlin Binary Compatibility
# Validator, Kotlin Multiplatform target test tasks). Adjust task names
# here if the real Gradle setup differs once it lands.

"on":
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    name: Build, test, and lint (JVM/Android)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install codebase-memory-mcp
        run: npm install -g codebase-memory-mcp

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Install gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(gh release view --repo gitleaks/gitleaks --json tagName --jq '.tagName')
          ASSET="gitleaks_${VERSION#v}_linux_x64.tar.gz"
          URL="https://github.com/gitleaks/gitleaks/releases/download/${VERSION}/${ASSET}"
          curl -fsSL "$URL" -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan repository history for secrets
        run: gitleaks detect --source . --redact -v --config .gitleaks.toml

      - name: Install yamllint
        run: python3 -m pip install --user yamllint

      - name: YAML lint
        run: yamllint .

      - name: Install lychee
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/lychee
          gh release download --repo lycheeverse/lychee \
            --pattern '*x86_64-unknown-linux-gnu.tar.gz' \
            --dir /tmp/lychee --clobber
          tar -xf /tmp/lychee/*.tar.gz -C /tmp/lychee
          sudo install -m 0755 /tmp/lychee/lychee-*/lychee /usr/local/bin/lychee

      - name: Markdown lint + link check
        run: ./scripts/check-markdown.sh

      - name: ktfmt format check
        run: ./gradlew --console=plain ktfmtCheck

      - name: Detekt
        run: ./gradlew --console=plain detekt

      - name: Build and test — meshlink
        run: ./gradlew --console=plain :meshlink:build

      - name: Coverage gate (Kover)
        run: ./gradlew --console=plain koverVerify

      - name: Binary compatibility (BCV)
        run: ./gradlew --console=plain apiCheck

      - name: Build and check — meshlink-reference
        run: ./gradlew --console=plain :meshlink-reference:check

      - name: Build and check — meshlink-benchmark
        run: ./gradlew --console=plain :meshlink-benchmark:check

      - name: Build and check — meshlink-proof (Android)
        run: ./gradlew --console=plain :meshlink-proof:check

  ios-build:
    name: Build iOS targets
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build meshlink iOS target
        # The iOS simulator target was removed — BLE radios are not available
        # in the iOS simulator. Only the iosArm64 (device) target is compiled
        # here (not tested — real iOS device testing runs in meshlink-proof).
        # Non-radio logic (crypto, routing, wire codec) is covered by JVM
        # host tests in the verify job above.
        run: ./gradlew --console=plain :meshlink:compileKotlinIosArm64
