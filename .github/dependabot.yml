version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"

  # Gradle — root project (version catalog + build plugins)
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    groups:
      gradle-dependencies:
        - "ch.trancee.meshlink:*"
        - "org.jetbrains.kotlin*"
        - "com.android.tools.build*"
        - "org.jetbrains.kotlinx:*"
        - "com.squareup.*"
        - "org.jlleitsch.*"
