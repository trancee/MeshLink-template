name: Feature Request
description: Propose a new capability or improvement for MeshLink
title: 'feat: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a feature! Please describe what you'd like and why.
        For breaking changes to wire format or public API, this should go through
        an ADR in `docs/decisions/` and a CONSTITUTION amendment.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve? (Avoid proposing solutions without naming the problem.)
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should we solve it? Link to relevant specs or RFC sections if applicable.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What else did you consider? Why was it rejected?
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Which modules or spec files does this touch? (e.g. meshlink-crypto, specs/codecs/, meshlink-proof)
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Target platform
      description: Android, iOS, or both.
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature?
      options:
        - Low (nice to have)
        - Medium (would improve the product)
        - High (blocks use or adoption)
      default: 0
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, diagrams, or links to related issues/PRs.
    validations:
      required: false
