name: Bug Report
description: Report a defect in MeshLink
title: 'bug: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the information below.
        For security vulnerabilities, use GitHub's private vulnerability
        reporting instead — see [SECURITY.md](../../SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior. Include minimal code or wire captures if applicable.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened (include error messages, stack traces, or log excerpts with keys redacted).
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Android, iOS, or host environment (e.g. "Android 14, Pixel 6").
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MeshLink version
      description: Library version or commit SHA (e.g. "main @ abc1234" or "0.1.0-SNAPSHOT").
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: Does this bug block the reporter or cause data loss?
      options:
        - Non-blocking (cosmetic or minor)
        - Annoying (workaround exists)
        - Blocking (no workaround, affects release)
        - Critical (security, data loss, or crash)
      default: 1
    validations:
      required: true
  - type: input
    id: regression
    attributes:
      label: Regression
      description: Did this work in a previous version? If so, which one?
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add any other context, logs, or wire captures here. Redact all secrets.
    validations:
      required: false
